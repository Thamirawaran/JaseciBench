name: grade-pr

# Maintainer-triggered hidden evaluation of a pull request.
#
# Run from the Actions tab: pick "grade-pr", "Run workflow", enter the
# PR number, and choose a grading mode. This resolves the PR's head ref,
# fires repository_dispatch into the private vault, and posts a "queued"
# comment on the PR. Final scores are posted by the vault's grading
# workflow(s) when grading completes.
#
# Grading modes:
#   cumulative -> vault grade-submission.yml (event_type grade-pr): the
#                 PR head's single app tree graded against every task.
#                 Tasks the agent did not fix remain in the bug state
#                 baked into the public base, so their tests fail.
#   isolated   -> vault grade-isolated.yml (event_type grade-isolated):
#                 per-task snapshots under snapshots/<task_id>/ at the PR
#                 head, each graded against only its matching task.
#                 Requires the `suite` input.
#   both       -> fire both (two result comments will be posted).
#
# Why workflow_dispatch and not auto-on-PR: only users with write
# access to this repo can trigger workflow_dispatch, which keeps
# unsolicited external PRs out of the grading queue.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to grade"
        required: true
        type: string
      mode:
        description: "Grading mode"
        required: true
        type: choice
        options:
          - cumulative
          - isolated
          - both
        default: cumulative
      suite:
        description: "Suite key for isolated mode, e.g. medium/ecommerce/jaclang"
        required: false
        type: string
        default: medium/ecommerce/jaclang
      snapshots_path:
        description: "Path to the snapshots/ dir in the PR head (isolated mode)"
        required: false
        type: string
        default: snapshots

permissions:
  pull-requests: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR head ref
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          info=$(gh api repos/${{ github.repository }}/pulls/${{ inputs.pr_number }})
          head_sha=$(echo "$info" | jq -r .head.sha)
          head_repo=$(echo "$info" | jq -r .head.repo.full_name)
          if [ -z "$head_sha" ] || [ "$head_sha" = "null" ]; then
            echo "::error::Could not resolve PR #${{ inputs.pr_number }}"
            exit 1
          fi
          echo "sha=$head_sha"   >> "$GITHUB_OUTPUT"
          echo "repo=$head_repo" >> "$GITHUB_OUTPUT"
          echo "Resolved PR #${{ inputs.pr_number }} -> $head_repo @ $head_sha"

      - name: Validate inputs
        env:
          MODE: ${{ inputs.mode }}
          SUITE: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "isolated" ] || [ "$MODE" = "both" ]; then
            [ -n "$SUITE" ] || { echo "::error::mode '$MODE' requires a 'suite' input"; exit 1; }
          fi

      - name: Dispatch cumulative grading to vault
        if: ${{ inputs.mode == 'cumulative' || inputs.mode == 'both' }}
        env:
          GH_TOKEN: ${{ secrets.JASECIBENCH_VAULT_DISPATCH_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
          HEAD_REPO: ${{ steps.pr.outputs.repo }}
        run: |
          set -euo pipefail
          gh api repos/Thamirawaran/JaseciBench-vault/dispatches \
            -X POST \
            -F event_type=grade-pr \
            -F "client_payload[pr_number]=$PR_NUMBER" \
            -F "client_payload[head_sha]=$HEAD_SHA" \
            -F "client_payload[head_repo]=$HEAD_REPO"

      - name: Dispatch isolated grading to vault
        if: ${{ inputs.mode == 'isolated' || inputs.mode == 'both' }}
        env:
          GH_TOKEN: ${{ secrets.JASECIBENCH_VAULT_DISPATCH_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
          HEAD_REPO: ${{ steps.pr.outputs.repo }}
          SUITE: ${{ inputs.suite }}
          SNAPSHOTS_PATH: ${{ inputs.snapshots_path }}
        run: |
          set -euo pipefail
          gh api repos/Thamirawaran/JaseciBench-vault/dispatches \
            -X POST \
            -F event_type=grade-isolated \
            -F "client_payload[pr_number]=$PR_NUMBER" \
            -F "client_payload[head_sha]=$HEAD_SHA" \
            -F "client_payload[head_repo]=$HEAD_REPO" \
            -F "client_payload[suite]=$SUITE" \
            -F "client_payload[snapshots_path]=$SNAPSHOTS_PATH"

      - name: Acknowledge on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
          MODE: ${{ inputs.mode }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --repo ${{ github.repository }} \
            --body "Hidden evaluation queued (mode: \`$MODE\`) for \`$HEAD_SHA\`. Results will appear here when grading completes (~2 min)."
